<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Cofre (captura)</title>
<style>
html,body{margin:0;background:transparent}
svg.cofre{display:block;width:960px;height:1040px}
/* Cofre animado (components/CofreAnimado.tsx). Estados en data-estado:
   cerrado | abriendo | abierto | vacio. */
.cofre {
  overflow: visible;
}
.cofre .cofre-todo {
  transform-origin: 80px 134px;
}
.cofre .cofre-tapa {
  transform-origin: 18px 78px;
}
.cofre .cofre-rayos {
  transform-origin: 80px 74px;
}
.cofre .cofre-moneda,
.cofre .cofre-estrella {
  transform-box: fill-box;
  transform-origin: center;
}
.cofre .cofre-rayos,
.cofre .cofre-brillo,
.cofre .cofre-moneda,
.cofre .cofre-estrella {
  opacity: 0;
}

.cofre[data-estado="cerrado"] .cofre-todo {
  animation: cofre-agitar 2.8s ease-in-out infinite;
}
.cofre[data-estado="abriendo"] .cofre-todo {
  animation: cofre-temblar 0.16s ease-in-out infinite alternate;
}
.cofre[data-estado="abierto"] .cofre-tapa {
  animation: cofre-tapa-abrir 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.15) forwards;
}
.cofre[data-estado="vacio"] .cofre-tapa {
  transform: translate(-4px, -34px) rotate(-12deg) scaleY(0.78);
}
.cofre[data-estado="abierto"] .cofre-rayos {
  animation: cofre-aparecer 0.6s ease-out 0.15s forwards, cofre-giro 16s linear infinite;
}
.cofre[data-estado="abierto"] .cofre-brillo {
  animation: cofre-aparecer 0.4s ease-out 0.15s forwards;
}
.cofre[data-estado="abierto"] .cofre-moneda {
  animation: cofre-moneda 1.1s ease-out 0.2s both;
}
.cofre[data-estado="abierto"] .cofre-estrella {
  animation: cofre-brillar 1.8s ease-in-out infinite;
}

@keyframes cofre-agitar {
  0%, 62%, 100% { transform: rotate(0); }
  68% { transform: rotate(-3deg); }
  74% { transform: rotate(3deg); }
  80% { transform: rotate(-2.5deg); }
  86% { transform: rotate(2.5deg); }
  92% { transform: rotate(0); }
}
@keyframes cofre-temblar {
  from { transform: translateX(-2px) rotate(-2.5deg); }
  to { transform: translateX(2px) rotate(2.5deg); }
}
@keyframes cofre-tapa-abrir {
  0% { transform: none; }
  25% { transform: translateY(3px) scaleY(0.96); }
  100% { transform: translate(-4px, -34px) rotate(-12deg) scaleY(0.78); }
}
@keyframes cofre-aparecer {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes cofre-giro {
  to { transform: rotate(360deg); }
}
@keyframes cofre-moneda {
  0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
  15% { opacity: 1; }
  55% { transform: translate(calc(var(--dx) * 0.8), var(--dy)) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), 40px) scale(1); opacity: 0; }
}
@keyframes cofre-brillar {
  0%, 100% { transform: scale(0); opacity: 0; }
  50% { transform: scale(1); opacity: 1; }
}


</style></head><body>
<div id="c"></div>
<script>
// Mismo dibujo que components/CofreAnimado.tsx (SVG), con un margen extra en el
// viewBox para que no se recorten las monedas ni los rayos al salir.
const MONEDAS=[[-46,-92,0],[-28,-110,.05],[-10,-100,.1],[12,-112,.03],[30,-98,.12],[48,-88,.07],[-38,-66,.16],[40,-70,.2],[0,-118,.18],[-18,-84,.24]];
const ESTRELLAS=[[24,34,.3],[136,30,.55],[112,6,.8],[44,10,1.0]];
const ESTRELLA="M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2Z";
const OR='url(#oro)',MAD='url(#madera)';
const rayos=[...Array(8).keys()].map(i=>`<path d="M80 74 L69 4 L91 4Z" fill="url(#rayo)" transform="rotate(${i*45} 80 74)"/>`).join('');
const monedas=MONEDAS.map(([dx,dy,d])=>`<g class="cofre-moneda" style="--dx:${dx}px;--dy:${dy}px;animation-delay:${d}s"><circle cx="80" cy="72" r="7" fill="${OR}" stroke="#a88300" stroke-width="1"/><circle cx="80" cy="72" r="4" fill="none" stroke="#a88300" stroke-width="1"/></g>`).join('');
const estrellas=ESTRELLAS.map(([x,y,d])=>`<g transform="translate(${x} ${y})"><path class="cofre-estrella" d="${ESTRELLA}" fill="#fff6c2" style="animation-delay:${d}s"/></g>`).join('');
const estado=new URLSearchParams(location.search).get('estado')||'cerrado';
document.getElementById('c').innerHTML=`<svg class="cofre" data-estado="${estado}" viewBox="-40 -60 240 260" aria-hidden="true"><defs>
<linearGradient id="madera" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a35a26"/><stop offset="1" stop-color="#5e2f10"/></linearGradient>
<linearGradient id="oro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe36b"/><stop offset="1" stop-color="#d9a400"/></linearGradient>
<linearGradient id="rayo" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffd426" stop-opacity=".55"/><stop offset="1" stop-color="#ffd426" stop-opacity="0"/></linearGradient>
<radialGradient id="brillo"><stop offset="0" stop-color="#fff6c2"/><stop offset=".6" stop-color="#ffd426"/><stop offset="1" stop-color="#ffd426" stop-opacity="0"/></radialGradient></defs>
<g class="cofre-todo"><g class="cofre-rayos">${rayos}</g>
<rect x="22" y="72" width="116" height="60" rx="7" fill="${MAD}"/>
<path d="M22 92H138M22 112H138" stroke="#000" stroke-opacity=".22" stroke-width="1.5"/>
<rect x="38" y="72" width="12" height="60" fill="${OR}"/><rect x="110" y="72" width="12" height="60" fill="${OR}"/>
<rect x="18" y="124" width="124" height="10" rx="4" fill="${OR}"/>
<rect x="70" y="84" width="20" height="22" rx="4" fill="${OR}" stroke="#8a6a00" stroke-width="1"/>
<circle cx="80" cy="93" r="3.2" fill="#3b2a00"/><rect x="78.8" y="94" width="2.4" height="7" rx="1" fill="#3b2a00"/>
<ellipse cx="80" cy="73" rx="57" ry="7" fill="#2b1206"/>
<ellipse class="cofre-brillo" cx="80" cy="72" rx="52" ry="6" fill="url(#brillo)"/>
${monedas}
<g class="cofre-tapa"><path d="M18 78 V52 Q18 24 80 24 Q142 24 142 52 V78 Z" fill="${MAD}"/>
<path d="M38 33 Q44 31 50 30 V78 H38Z" fill="${OR}"/><path d="M110 30 Q116 31 122 33 V78 H110Z" fill="${OR}"/>
<rect x="14" y="70" width="132" height="9" rx="3.5" fill="${OR}"/>
<path d="M30 50 Q34 35 68 31" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
<rect x="74" y="64" width="12" height="15" rx="3" fill="${OR}" stroke="#8a6a00" stroke-width="1"/></g>
${estrellas}</g></svg>`;
</script></body></html>
