name: Actualizar Elo (lista FIDE)

on:
  schedule:
    # La FIDE publica la lista a primeros de mes. Se intenta los días 2 a 6;
    # si la lista aún es la del mes anterior, el script no hace nada, y si ya
    # se aplicó, repetirlo no cambia nada.
    - cron: "0 6 2-6 * *"
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar los cambios (si no, solo vista previa)"
        type: boolean
        default: false
      forzar:
        description: "Saltar la comprobación de que la lista es de este mes"
        type: boolean
        default: false

jobs:
  elo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # COMPRUEBA esta URL en https://ratings.fide.com/download_lists.phtml
      FIDE_URL: https://ratings.fide.com/download/standard_rating_list_xml.zip
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock sax
      - name: Descargar la lista de la FIDE
        run: |
          curl -fsSL \
            --connect-timeout 30 --max-time 900 \
            --retry 5 --retry-delay 20 --retry-all-errors \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -e "https://ratings.fide.com/download_lists.phtml" \
            -o lista.zip "$FIDE_URL"
          ls -l lista.zip
          unzip -tq lista.zip
      - name: Actualizar Elo
        env:
          # En la ejecución programada se aplica; en la manual, según el interruptor.
          APLICAR: ${{ github.event_name == 'schedule' && 'true' || inputs.aplicar }}
          FORZAR: ${{ inputs.forzar }}
        run: unzip -p lista.zip | node scripts/fide-elo.mjs